<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マイウェブポータル</title>
  <style>
    body {
      background: #111827;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 30px 15px;
    }
    h1 { color: #60a5fa; }
    input, button {
      padding: 12px;
      margin: 6px;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>マイウェブポータル</h1>
  <p>自分のWebサイトへようこそ！</p>
  <input id="address" type="url"
    placeholder="URLを入力（例：https://example.com）">
  <button onclick="openSite()">開く</button>
  <p id="message"></p>
  <script>
    function openSite() {
      const address = document.getElementById('address').value.trim();
      if (!/^https?:\/\//i.test(address)) {
        document.getElementById('message').textContent =
          'https:// から始まるURLを入力してね。';
        return;
      }
      window.open(address, '_blank', 'noopener,noreferrer');
    }
  </script>
</body>
</html>
